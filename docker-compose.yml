# 可选聚合入口：仅作为 profile 壳引用各产品 compose 文件。
# 日常实验请使用 npm run lab -- <product> <lab>（独立 Compose Project 隔离）。
# 镜像变量来自 .env.versions：
#   docker compose --env-file .env.versions --profile rabbitmq up -d

services:
  rabbitmq:
    extends:
      file: compose/rabbitmq.compose.yml
      service: rabbitmq
    profiles: ["rabbitmq"]
