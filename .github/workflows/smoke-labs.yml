name: smoke-labs

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - product: rabbitmq
            lab: basic
          - product: rabbitmq
            lab: routing
          - product: rabbitmq
            lab: consumer-crash
          - product: rabbitmq
            lab: retry-dlq
          - product: rabbitmq
            lab: backlog-recovery
          - product: kafka
            lab: basic
          - product: kafka
            lab: consumer-group
          - product: kafka
            lab: ordering-replay
          - product: kafka
            lab: idempotence-transaction
          - product: rocketmq
            lab: basic
          - product: rocketmq
            lab: fifo-delay
          - product: rocketmq
            lab: transaction
          - product: rocketmq
            lab: retry-dlq
          - product: pulsar
            lab: basic
          - product: pulsar
            lab: subscriptions
          - product: pulsar
            lab: redelivery-replay
          - product: nats
            lab: core-pubsub
          - product: nats
            lab: jetstream-replay
          - product: redis-streams
            lab: basic
          - product: redis-streams
            lab: consumer-crash
          - product: artemis
            lab: basic
          - product: artemis
            lab: retry-dlq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: run lab
        run: bash "demos/${{ matrix.product }}/${{ matrix.lab }}/run.sh"
      - name: upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab-diagnostics-${{ matrix.product }}-${{ matrix.lab }}
          path: |
            demos/${{ matrix.product }}/${{ matrix.lab }}/
          if-no-files-found: ignore
