name: smoke-labs

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  evidence-labs:
    name: evidence (${{ matrix.product }}/${{ matrix.lab }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HELLO_MQ_COMPOSE_TIMEOUT_SECONDS: '540'
      HELLO_MQ_SCENARIO_TIMEOUT_SECONDS: '540'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - product: rabbitmq
            lab: routing
          - product: rabbitmq
            lab: consumer-crash
          - product: rabbitmq
            lab: retry-dlq
          - product: rabbitmq
            lab: backlog-recovery
          - product: kafka
            lab: basic
          - product: kafka
            lab: consumer-group
          - product: kafka
            lab: ordering-replay
          - product: kafka
            lab: idempotence-transaction
          - product: redis-streams
            lab: consumer-crash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: install evidence tooling
        run: npm ci
      - name: collect replay evidence
        id: lab
        continue-on-error: true
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=45s 1260s npm run collect:playground -- --scenario "${{ matrix.product }}/${{ matrix.lab }}"

      - name: summarize evidence lab
        if: always()
        shell: bash
        run: |
          lab_dir="demos/${{ matrix.product }}/${{ matrix.lab }}"
          echo "## Evidence ${{ matrix.product }}/${{ matrix.lab }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "执行结果：${{ steps.lab.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$lab_dir/assert.out.txt" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat "$lab_dir/assert.out.txt" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "未生成 assert.out.txt；请查看诊断制品和步骤日志。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: upload diagnostics on failure
        if: always() && steps.lab.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lab-diagnostics-evidence-${{ matrix.product }}-${{ matrix.lab }}
          path: demos/${{ matrix.product }}/${{ matrix.lab }}/
          if-no-files-found: ignore

      - name: stage replay evidence
        if: steps.lab.outcome == 'success'
        shell: bash
        run: |
          mkdir -p evidence-staging
          scenarios=("${{ matrix.lab }}")
          if [ "${{ matrix.lab }}" = "consumer-crash" ]; then
            scenarios+=(basic)
          fi
          for scenario in "${scenarios[@]}"; do
            find "demos/${{ matrix.product }}/$scenario" -maxdepth 1 -type f \
              \( -name '*.out.txt' -o -name 'replay.raw.jsonl' -o -name 'capture.json' -o -name 'replay.json' \) \
              -exec cp --parents {} evidence-staging/ \;
          done

      - name: upload replay evidence
        if: steps.lab.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lab-evidence-${{ matrix.product }}-${{ matrix.lab }}
          path: evidence-staging/
          if-no-files-found: error

      - name: propagate evidence failure
        if: always() && steps.lab.outcome != 'success'
        run: exit 1

  smoke-labs:
    name: smoke (${{ matrix.product }}/${{ matrix.lab }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HELLO_MQ_COMPOSE_TIMEOUT_SECONDS: '540'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - product: rocketmq
            lab: basic
          - product: rocketmq
            lab: fifo-delay
          - product: rocketmq
            lab: transaction
          - product: rocketmq
            lab: retry-dlq
          - product: pulsar
            lab: basic
          - product: pulsar
            lab: subscriptions
          - product: pulsar
            lab: redelivery-replay
          - product: nats
            lab: core-pubsub
          - product: nats
            lab: jetstream-replay
          - product: artemis
            lab: basic
          - product: artemis
            lab: retry-dlq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: run smoke lab
        id: lab
        continue-on-error: true
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=45s 660s bash "demos/${{ matrix.product }}/${{ matrix.lab }}/run.sh"

      - name: summarize smoke lab
        if: always()
        shell: bash
        run: |
          lab_dir="demos/${{ matrix.product }}/${{ matrix.lab }}"
          echo "## Smoke ${{ matrix.product }}/${{ matrix.lab }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "执行结果：${{ steps.lab.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$lab_dir/assert.out.txt" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat "$lab_dir/assert.out.txt" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "未生成 assert.out.txt；请查看诊断制品和步骤日志。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: upload diagnostics on failure
        if: always() && steps.lab.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lab-diagnostics-smoke-${{ matrix.product }}-${{ matrix.lab }}
          path: demos/${{ matrix.product }}/${{ matrix.lab }}/
          if-no-files-found: ignore

      - name: propagate smoke failure
        if: always() && steps.lab.outcome != 'success'
        run: exit 1

  publish-evidence:
    name: commit verified replay evidence
    needs: evidence-labs
    if: success()
    runs-on: ubuntu-latest
    concurrency:
      group: playground-evidence-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: download replay evidence
        uses: actions/download-artifact@v4
        with:
          pattern: lab-evidence-*
          path: collected-evidence
          merge-multiple: true
      - name: restore and verify evidence
        shell: bash
        run: |
          test -d collected-evidence/demos
          cp -R collected-evidence/demos/. demos/
          npm ci
          npm run check:playground
      - name: commit evidence to main
        shell: bash
        run: |
          find demos/rabbitmq demos/kafka demos/redis-streams -type f \
            \( -name '*.out.txt' -o -name 'capture.json' -o -name 'replay.raw.jsonl' -o -name 'replay.json' \) \
            -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "证据内容未变化，无需提交。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh MQ playground evidence [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  diagnostics:
    name: combined failure diagnostics
    needs: [evidence-labs, smoke-labs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: download failed lab artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: lab-diagnostics-*
          path: smoke-diagnostics

      - name: summarize available diagnostics
        if: always()
        shell: bash
        run: |
          echo "## Smoke Lab 失败诊断" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -d smoke-diagnostics ]; then
            find smoke-diagnostics -mindepth 1 -maxdepth 1 -type d -printf '- `%f`\n' | sort >> "$GITHUB_STEP_SUMMARY"
          else
            echo "本次没有失败诊断制品。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: upload combined diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-labs-diagnostics-${{ github.run_id }}
          path: smoke-diagnostics/
          if-no-files-found: ignore
