name: smoke-labs

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - product: rabbitmq
            lab: basic
          - product: rabbitmq
            lab: routing
          - product: rabbitmq
            lab: consumer-crash
          - product: rabbitmq
            lab: retry-dlq
          - product: rabbitmq
            lab: backlog-recovery
          - product: kafka
            lab: basic
          - product: kafka
            lab: consumer-group
          - product: kafka
            lab: ordering-replay
          - product: kafka
            lab: idempotence-transaction
          - product: rocketmq
            lab: basic
          - product: rocketmq
            lab: fifo-delay
          - product: rocketmq
            lab: transaction
          - product: rocketmq
            lab: retry-dlq
          - product: pulsar
            lab: basic
          - product: pulsar
            lab: subscriptions
          - product: pulsar
            lab: redelivery-replay
          - product: nats
            lab: core-pubsub
          - product: nats
            lab: jetstream-replay
          - product: redis-streams
            lab: basic
          - product: redis-streams
            lab: consumer-crash
          - product: artemis
            lab: basic
          - product: artemis
            lab: retry-dlq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: run lab
        id: lab
        continue-on-error: true
        run: bash "demos/${{ matrix.product }}/${{ matrix.lab }}/run.sh"

      - name: summarize lab
        if: always()
        shell: bash
        run: |
          lab_dir="demos/${{ matrix.product }}/${{ matrix.lab }}"
          echo "## ${{ matrix.product }}/${{ matrix.lab }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "执行结果：${{ steps.lab.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$lab_dir/assert.out.txt" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat "$lab_dir/assert.out.txt" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "未生成 assert.out.txt；请查看诊断制品和步骤日志。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: upload diagnostics on failure
        if: always() && steps.lab.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lab-diagnostics-${{ matrix.product }}-${{ matrix.lab }}
          path: |
            demos/${{ matrix.product }}/${{ matrix.lab }}/
          if-no-files-found: ignore

      - name: propagate lab failure
        if: always() && steps.lab.outcome != 'success'
        run: exit 1
