name: collect-playground-evidence

on:
  workflow_dispatch:

concurrency:
  group: playground-evidence-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: 检出 main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 配置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 检查采集工具
        run: |
          docker version
          docker compose version
          bash --version
          mvn --version
          jq --version

      - name: 安装文档依赖
        run: npm ci

      - name: 顺序采集 11 个交互回放场景
        run: npm run collect:playground

      - name: 严格校验证据并构建文档
        run: |
          npm run check:playground
          npm run docs:build

      - name: 提交规范化证据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            ':(glob)demos/rabbitmq/*/*.out.txt' \
            ':(glob)demos/rabbitmq/*/capture.json' \
            ':(glob)demos/rabbitmq/*/replay.raw.jsonl' \
            ':(glob)demos/rabbitmq/*/replay.json' \
            ':(glob)demos/kafka/*/*.out.txt' \
            ':(glob)demos/kafka/*/capture.json' \
            ':(glob)demos/kafka/*/replay.raw.jsonl' \
            ':(glob)demos/kafka/*/replay.json' \
            ':(glob)demos/redis-streams/*/*.out.txt' \
            ':(glob)demos/redis-streams/*/capture.json' \
            ':(glob)demos/redis-streams/*/replay.raw.jsonl' \
            ':(glob)demos/redis-streams/*/replay.json'
          if git diff --cached --quiet; then
            echo "Playground evidence is unchanged."
            exit 0
          fi
          git commit -m "chore: update MQ playground evidence (run $GITHUB_RUN_ID)"
          git push origin HEAD:main

      - name: 上传采集结果备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mq-playground-evidence-${{ github.run_id }}
          path: |
            demos/rabbitmq/*/*.out.txt
            demos/rabbitmq/*/capture.json
            demos/rabbitmq/*/replay.raw.jsonl
            demos/rabbitmq/*/replay.json
            demos/kafka/*/*.out.txt
            demos/kafka/*/capture.json
            demos/kafka/*/replay.raw.jsonl
            demos/kafka/*/replay.json
            demos/redis-streams/*/*.out.txt
            demos/redis-streams/*/capture.json
            demos/redis-streams/*/replay.raw.jsonl
            demos/redis-streams/*/replay.json
          if-no-files-found: warn
