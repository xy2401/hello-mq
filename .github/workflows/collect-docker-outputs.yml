name: collect-docker-outputs

on:
  workflow_dispatch:

concurrency:
  group: docker-evidence-main
  cancel-in-progress: false

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    steps:
      - name: 📥 检出项目代码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: ☕ 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 📦 安装文档依赖
        run: npm ci

      - name: 🐳 运行统一 Docker/CLI 证据采集
        run: npm run collect:docker

      - name: 🏗️ 验证 catalog 与 VitePress 构建
        run: npm run check

      - name: 💾 提交采集证据到 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .env.versions ':(glob)demos/**/docker/*.out.txt'
          if git diff --cached --quiet; then
            echo "Docker evidence is unchanged."
            exit 0
          fi
          git commit -m "chore: update Docker evidence (run $GITHUB_RUN_ID)"
          git push origin HEAD:main

      - name: 📦 上传镜像锁与证据快照备份
        uses: actions/upload-artifact@v4
        with:
          name: hello-mq-docker-evidence-${{ github.run_id }}
          path: |
            .env.versions
            demos/**/docker/*.out.txt
          include-hidden-files: true
          if-no-files-found: error
