name: collect-docker-outputs

on:
  workflow_dispatch:

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - name: 📥 检出项目代码
        uses: actions/checkout@v4

      - name: ☕ 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 🟢 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 📦 安装文档依赖
        run: npm ci

      - name: 🐳 运行统一 Docker/CLI 证据采集
        run: npm run collect:docker

      - name: 🏗️ 验证 catalog 与 VitePress 构建
        run: npm run check

      - name: 📦 上传待审查的镜像锁与证据快照
        uses: actions/upload-artifact@v4
        with:
          name: hello-mq-docker-evidence-${{ github.run_id }}
          path: |
            .env.versions
            demos/**/docker/*.out.txt
          include-hidden-files: true
          if-no-files-found: error
