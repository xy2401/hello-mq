# kafka/consumer-group 完整实验流程：同组 a-1/a-2 并行瓜分分区（空闲超时退出），独立组 b-1 再次全量接收。
# a 组分配不确定：两消费者各自落库，run.sh 合并统计；b-1 只依赖 producer（组间互不影响）。
# 独立运行：bash run.sh
name: hello-mq-kafka-consumer-group

x-java-base: &java-base
  image: ${TEMURIN_JRE_IMAGE:?TEMURIN_JRE_IMAGE must be set via --env-file ../.env.versions}
  volumes:
    - ../target/hello-mq-kafka.jar:/app/demo.jar:ro
    - ../../shared/fixtures:/app/fixtures:ro
    - ./.replay-gate:/replay-gate
  environment:
    HELLO_MQ_REPLAY_CAPTURE: ${HELLO_MQ_REPLAY_CAPTURE:-0}
    HELLO_MQ_REPLAY_GATE_DIR: /replay-gate

services:
  kafka:
    image: ${KAFKA_IMAGE:?KAFKA_IMAGE must be set via --env-file ../.env.versions}
    hostname: hello-mq-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # 官方镜像示例 CLUSTER_ID（kafka-storage random-uuid 的文档样例值，非秘密）。
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # 实验客户端运行在 compose 网络内：advertise 服务名 kafka:9092（区别于 compose/kafka.compose.yml 的宿主机回环）。
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    # 实验语义要求每次全新启动：不挂持久卷，down 时数据随容器一起销毁。
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  setup:
    <<: *java-base
    depends_on:
      kafka:
        condition: service_healthy
    command: ["java", "-jar", "/app/demo.jar", "setup", "--lab=consumer-group", "--bootstrap=kafka:9092"]

  producer:
    <<: *java-base
    depends_on:
      setup:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - produce
      - --lab=consumer-group
      - --bootstrap=kafka:9092
      - --topic=orders.group
      - --files=order-1001.json,order-1002.json,order-1003.json
      - --fixtures=/app/fixtures

  # 同组并行消费：分区分配不确定，用 --idle-exit-ms 空闲超时退出，各自独立落库。
  consumer-a-1:
    <<: *java-base
    volumes:
      - ../target/hello-mq-kafka.jar:/app/demo.jar:ro
      - ../../shared/fixtures:/app/fixtures:ro
      - idempotency:/data
    depends_on:
      producer:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - consume
      - --lab=consumer-group
      - --bootstrap=kafka:9092
      - --topic=orders.group
      - --group=orders-group-a
      - --db=/data/idempotency-a-1.db
      - --consumer=a-1
      - --idle-exit-ms=8000

  consumer-a-2:
    <<: *java-base
    volumes:
      - ../target/hello-mq-kafka.jar:/app/demo.jar:ro
      - ../../shared/fixtures:/app/fixtures:ro
      - idempotency:/data
    depends_on:
      producer:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - consume
      - --lab=consumer-group
      - --bootstrap=kafka:9092
      - --topic=orders.group
      - --group=orders-group-a
      - --db=/data/idempotency-a-2.db
      - --consumer=a-2
      - --idle-exit-ms=8000

  # 独立组 b：只依赖 producer（与 a 组并行无碍），从头全量接收同一批消息。
  consumer-b-1:
    <<: *java-base
    volumes:
      - ../target/hello-mq-kafka.jar:/app/demo.jar:ro
      - ../../shared/fixtures:/app/fixtures:ro
      - idempotency:/data
    depends_on:
      producer:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - consume
      - --lab=consumer-group
      - --bootstrap=kafka:9092
      - --topic=orders.group
      - --group=orders-group-b
      - --db=/data/idempotency-b.db
      - --consumer=b-1
      - --expected=3

  inspect-db-b:
    <<: *java-base
    volumes:
      - ../target/hello-mq-kafka.jar:/app/demo.jar:ro
      - idempotency:/data:ro
    depends_on:
      consumer-b-1:
        condition: service_completed_successfully
    command: ["java", "-jar", "/app/demo.jar", "inspect-db", "--lab=consumer-group", "--db=/data/idempotency-b.db"]

volumes:
  idempotency:
