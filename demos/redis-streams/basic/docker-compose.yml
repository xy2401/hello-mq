# redis-streams/basic 完整实验流程：broker → 拓扑初始化（Consumer Group）→ 生产 → 消费 → 幂等库检查。
# XACK 不从 Stream 删除条目：run.sh 另经 redis-cli 断言 streamLength/pending。
# 独立运行：bash run.sh（或先 mvn -f demos/pom.xml package 后 docker compose --env-file ../.env.versions up）
name: hello-mq-redis-streams-basic

x-java-base: &java-base
  image: ${TEMURIN_JRE_IMAGE:?TEMURIN_JRE_IMAGE must be set via --env-file ../.env.versions}
  volumes:
    - ../target/hello-mq-redis-streams.jar:/app/demo.jar:ro
    - ../../shared/fixtures:/app/fixtures:ro
    - ./.replay-gate:/replay-gate
  environment:
    HELLOMQ_REDIS_HOST: redis
    HELLO_MQ_REPLAY_CAPTURE: ${HELLO_MQ_REPLAY_CAPTURE:-0}
    HELLO_MQ_REPLAY_GATE_DIR: /replay-gate

services:
  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be set via --env-file ../.env.versions}
    hostname: hello-mq-redis
    # AOF 开启：Streams 条目落盘语义实验；消息安全仍取决于持久化策略（见分卷 reliability 页）
    command: ["redis-server", "--appendonly", "yes"]
    # 实验语义要求每次全新启动：不挂持久卷，down 时数据随容器一起销毁。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  setup:
    <<: *java-base
    depends_on:
      redis:
        condition: service_healthy
    command: ["java", "-jar", "/app/demo.jar", "setup", "--lab=basic"]

  producer:
    <<: *java-base
    depends_on:
      setup:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - produce
      - --lab=basic
      - --stream=orders.basic
      - --files=order-1001.json,order-1002.json,order-1003.json
      - --fixtures=/app/fixtures

  consumer:
    <<: *java-base
    volumes:
      - ../target/hello-mq-redis-streams.jar:/app/demo.jar:ro
      - ../../shared/fixtures:/app/fixtures:ro
      - idempotency:/data
    depends_on:
      producer:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - consume
      - --stream=orders.basic
      - --group=orders-basic-group
      - --consumer=consumer-1
      - --db=/data/idempotency.db
      - --lab=basic
      - --expected=3

  inspect-db:
    <<: *java-base
    volumes:
      - ../target/hello-mq-redis-streams.jar:/app/demo.jar:ro
      - idempotency:/data:ro
    depends_on:
      consumer:
        condition: service_completed_successfully
    command: ["java", "-jar", "/app/demo.jar", "inspect-db", "--lab=basic", "--db=/data/idempotency.db"]

volumes:
  idempotency:
