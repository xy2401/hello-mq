# pulsar/basic 完整实验流程：broker → 拓扑初始化 → 消费订阅 → 生产 → 消费 → 幂等库检查。
# Pulsar 新订阅默认从 Latest 开始：消费者必须先完成订阅再生产，
# run.sh 分阶段编排（先起 consumer 并轮询 status=subscribed，再起 producer）。
# 独立运行：bash run.sh（或先 mvn -f demos/pom.xml package 后 docker compose --env-file ../.env.versions up）
name: hello-mq-pulsar-basic

x-java-base: &java-base
  image: ${TEMURIN_JRE_IMAGE:?TEMURIN_JRE_IMAGE must be set via --env-file ../.env.versions}
  volumes:
    - ../target/hello-mq-pulsar.jar:/app/demo.jar:ro
    - ../../shared/fixtures:/app/fixtures:ro

services:
  pulsar:
    image: ${PULSAR_IMAGE:?PULSAR_IMAGE must be set via --env-file ../.env.versions}
    command: ["bin/pulsar", "standalone", "-nss"]
    environment:
      # standalone 内嵌 broker + BookKeeper + ZooKeeper；实验机资源有限，显式压低堆与直接内存。
      PULSAR_MEM: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m"
      PULSAR_GC: "-XX:+UseG1GC"
    ports:
      - "127.0.0.1:6650:6650"
      - "127.0.0.1:8080:8080"
    # standalone 冷启动要初始化 BookKeeper ledger 与元数据，明显慢于普通 Broker。
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    # 实验语义要求每次全新启动：不挂持久卷，down 时数据随容器一起销毁。

  setup:
    <<: *java-base
    depends_on:
      pulsar:
        condition: service_healthy
    command: ["java", "-jar", "/app/demo.jar", "setup", "--lab=basic"]

  # 新订阅从 Latest 开始：consumer 先于 producer 启动，
  # “已订阅”的时机由 run.sh 轮询日志确认后再放行 producer。
  consumer:
    <<: *java-base
    volumes:
      - ../target/hello-mq-pulsar.jar:/app/demo.jar:ro
      - ../../shared/fixtures:/app/fixtures:ro
      - idempotency:/data
    depends_on:
      setup:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - consume
      - --topic=orders-basic
      - --subscription=orders-basic-sub
      - --sub-type=Exclusive
      - --db=/data/idempotency.db
      - --lab=basic
      - --expected=3
      - --service-url=pulsar://pulsar:6650

  producer:
    <<: *java-base
    depends_on:
      consumer:
        condition: service_started
    command:
      - java
      - -jar
      - /app/demo.jar
      - produce
      - --lab=basic
      - --topic=orders-basic
      - --files=order-1001.json,order-1002.json,order-1003.json
      - --fixtures=/app/fixtures
      - --service-url=pulsar://pulsar:6650

  inspect-db:
    <<: *java-base
    volumes:
      - ../target/hello-mq-pulsar.jar:/app/demo.jar:ro
      - idempotency:/data:ro
    depends_on:
      consumer:
        condition: service_completed_successfully
    command: ["java", "-jar", "/app/demo.jar", "inspect-db", "--lab=basic", "--db=/data/idempotency.db"]

volumes:
  idempotency:
