# artemis/retry-dlq 完整实验流程：消费失败按 address-setting 重投（共 3 次投递、固定 1s 间隔），
# 耗尽后转 orders-dlq 地址，由 --no-business 的 dlq-consumer 收出核对。
# 独立运行：bash run.sh
name: hello-mq-artemis-retry-dlq

x-java-base: &java-base
  image: ${TEMURIN_JRE_IMAGE:?TEMURIN_JRE_IMAGE must be set via --env-file ../.env.versions}
  volumes:
    - ../target/hello-mq-artemis.jar:/app/demo.jar:ro
    - ../../shared/fixtures:/app/fixtures:ro
    - idempotency:/data
  environment:
    HELLOMQ_ARTEMIS_URL: tcp://artemis:61616

services:
  artemis:
    image: ${ARTEMIS_IMAGE:?ARTEMIS_IMAGE must be set via --env-file ../.env.versions}
    hostname: hello-mq-artemis
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: hello-mq-artemis
    volumes:
      # 官方镜像会把此目录中的文件覆盖到实例配置，保证重试与 DLQ 设置生效。
      - ../broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
    ports:
      # 61616：CORE/AMQP/OPENWIRE/STOMP/MQTT 全协议 acceptor；8161：Web 控制台（hawtio）
      - "127.0.0.1:61616:61616"
      - "127.0.0.1:8161:8161"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/61616'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    # 实验语义要求每次全新启动：不挂持久卷，down 时数据随容器一起销毁。

  producer:
    <<: *java-base
    depends_on:
      artemis:
        condition: service_healthy
    command:
      - java
      - -jar
      - /app/demo.jar
      - produce
      - --lab=retry-dlq
      - --queue=orders-retry
      - --files=order-1001.json,poison-message.json
      - --fixtures=/app/fixtures

  # 重试策略在 broker.xml 的 address-setting：共 3 次投递、固定 1s 间隔、耗尽转 orders-dlq。
  consumer:
    <<: *java-base
    depends_on:
      producer:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - consume
      - --lab=retry-dlq
      - --queue=orders-retry
      - --db=/data/idempotency.db
      - --expected=1
      - --fail-aggregate=order-poison
      - --max-attempts=3

  inspect-db:
    <<: *java-base
    volumes:
      - ../target/hello-mq-artemis.jar:/app/demo.jar:ro
      - idempotency:/data:ro
    depends_on:
      consumer:
        condition: service_completed_successfully
    command: ["java", "-jar", "/app/demo.jar", "inspect-db", "--lab=retry-dlq", "--db=/data/idempotency.db"]

  # DLQ 观察：毒消息耗尽投递次数后进入 orders-dlq，用 --no-business 消费者收出并核对。
  dlq-consumer:
    <<: *java-base
    depends_on:
      inspect-db:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - consume
      - --lab=retry-dlq
      - --queue=orders-dlq
      - --db=/data/idempotency-dlq.db
      - --expected=1
      - --hard-timeout-ms=30000
      - --consumer=dlq-inspect
      - --no-business

volumes:
  idempotency:
