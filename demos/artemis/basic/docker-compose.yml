# artemis/basic 完整实验流程：broker → 生产 → 消费 → 幂等库检查 → 队列深度快照。
# 无 setup 命令：anycast 队列由 broker 自动创建，DLQ 拓扑在 broker.xml 预建。
# 独立运行：bash run.sh（或先 mvn -f demos/pom.xml package 后 docker compose --env-file ../.env.versions up）
name: hello-mq-artemis-basic

x-java-base: &java-base
  image: ${TEMURIN_JRE_IMAGE:?TEMURIN_JRE_IMAGE must be set via --env-file ../.env.versions}
  volumes:
    - ../target/hello-mq-artemis.jar:/app/demo.jar:ro
    - ../../shared/fixtures:/app/fixtures:ro
  environment:
    HELLOMQ_ARTEMIS_URL: tcp://artemis:61616

services:
  artemis:
    image: ${ARTEMIS_IMAGE:?ARTEMIS_IMAGE must be set via --env-file ../.env.versions}
    hostname: hello-mq-artemis
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: hello-mq-artemis
    volumes:
      # 镜像仅在文件缺失时生成 etc 配置：挂载自定义 broker.xml 承载实验所需的地址设置。
      - ../broker.xml:/var/lib/artemis/etc/broker.xml
    ports:
      # 61616：CORE/AMQP/OPENWIRE/STOMP/MQTT 全协议 acceptor；8161：Web 控制台（hawtio）
      - "127.0.0.1:61616:61616"
      - "127.0.0.1:8161:8161"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/61616'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    # 实验语义要求每次全新启动：不挂持久卷，down 时数据随容器一起销毁。

  producer:
    <<: *java-base
    depends_on:
      artemis:
        condition: service_healthy
    command:
      - java
      - -jar
      - /app/demo.jar
      - produce
      - --lab=basic
      - --queue=orders-basic
      - --files=order-1001.json,order-1002.json,order-1003.json
      - --fixtures=/app/fixtures

  consumer:
    <<: *java-base
    volumes:
      - ../target/hello-mq-artemis.jar:/app/demo.jar:ro
      - ../../shared/fixtures:/app/fixtures:ro
      - idempotency:/data
    depends_on:
      producer:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - consume
      - --lab=basic
      - --queue=orders-basic
      - --db=/data/idempotency.db
      - --expected=3

  inspect-db:
    <<: *java-base
    volumes:
      - ../target/hello-mq-artemis.jar:/app/demo.jar:ro
      - idempotency:/data:ro
    depends_on:
      consumer:
        condition: service_completed_successfully
    command: ["java", "-jar", "/app/demo.jar", "inspect-db", "--lab=basic", "--db=/data/idempotency.db"]

  # ack 即删除：全部确认后队列深度必须归零（对应 labs.mjs 的 queueDepth 断言）。
  stats:
    <<: *java-base
    depends_on:
      inspect-db:
        condition: service_completed_successfully
    command: ["java", "-jar", "/app/demo.jar", "stats", "--lab=basic", "--queue=orders-basic"]

volumes:
  idempotency:
