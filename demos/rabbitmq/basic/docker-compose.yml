# rabbitmq/basic 完整实验流程：broker → 拓扑初始化 → 生产 → 消费 → 幂等库检查。
# 独立运行：bash run.sh（或先 mvn -f demos/pom.xml package 后 docker compose --env-file ../.env.versions up）
name: hello-mq-rabbitmq-basic

x-java-base: &java-base
  image: ${TEMURIN_JRE_IMAGE:?TEMURIN_JRE_IMAGE must be set via --env-file ../.env.versions}
  volumes:
    - ../target/hello-mq-rabbitmq.jar:/app/demo.jar:ro
    - ../../shared/fixtures:/app/fixtures:ro
    - ./.replay-gate:/replay-gate
  environment:
    HELLO_MQ_REPLAY_CAPTURE: ${HELLO_MQ_REPLAY_CAPTURE:-0}
    HELLO_MQ_REPLAY_GATE_DIR: /replay-gate

services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:?RABBITMQ_IMAGE must be set via --env-file ../.env.versions}
    hostname: hello-mq-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    # 实验语义要求每次全新启动：不挂持久卷，down 时数据随容器一起销毁。
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  setup:
    <<: *java-base
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: ["java", "-jar", "/app/demo.jar", "setup", "--lab=basic", "--uri=amqp://guest:guest@rabbitmq:5672"]

  producer:
    <<: *java-base
    depends_on:
      setup:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - produce
      - --lab=basic
      - --uri=amqp://guest:guest@rabbitmq:5672
      - --queue=orders.basic
      - --files=order-1001.json,order-1002.json,order-1003.json
      - --fixtures=/app/fixtures

  consumer:
    <<: *java-base
    volumes:
      - ../target/hello-mq-rabbitmq.jar:/app/demo.jar:ro
      - ../../shared/fixtures:/app/fixtures:ro
      - idempotency:/data
    depends_on:
      producer:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - consume
      - --lab=basic
      - --uri=amqp://guest:guest@rabbitmq:5672
      - --queue=orders.basic
      - --db=/data/idempotency.db
      - --expected=3

  inspect-db:
    <<: *java-base
    volumes:
      - ../target/hello-mq-rabbitmq.jar:/app/demo.jar:ro
      - idempotency:/data:ro
    depends_on:
      consumer:
        condition: service_completed_successfully
    command: ["java", "-jar", "/app/demo.jar", "inspect-db", "--lab=basic", "--db=/data/idempotency.db"]

volumes:
  idempotency:
