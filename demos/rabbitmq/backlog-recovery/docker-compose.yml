# rabbitmq/backlog-recovery 完整实验流程：无消费者时消息积压在 durable 队列，
# 消费者启动后追赶清零。run.sh 分两阶段：先只起 producer 度量积压深度，再起 consumer。
# 独立运行：bash run.sh
name: hello-mq-rabbitmq-backlog-recovery

x-java-base: &java-base
  image: ${TEMURIN_JRE_IMAGE:?TEMURIN_JRE_IMAGE must be set via --env-file ../.env.versions}
  volumes:
    - ../target/hello-mq-rabbitmq.jar:/app/demo.jar:ro
    - ../../shared/fixtures:/app/fixtures:ro
    - idempotency:/data
    - ./.replay-gate:/replay-gate
  environment:
    HELLO_MQ_REPLAY_CAPTURE: ${HELLO_MQ_REPLAY_CAPTURE:-0}
    HELLO_MQ_REPLAY_GATE_DIR: /replay-gate

services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:?RABBITMQ_IMAGE must be set via --env-file ../.env.versions}
    hostname: hello-mq-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  setup:
    <<: *java-base
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: ["java", "-jar", "/app/demo.jar", "setup", "--lab=backlog-recovery", "--uri=amqp://guest:guest@rabbitmq:5672"]

  producer:
    <<: *java-base
    depends_on:
      setup:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - produce
      - --lab=backlog-recovery
      - --uri=amqp://guest:guest@rabbitmq:5672
      - --queue=orders.backlog
      - --files=order-1001.json,order-1002.json,order-1003.json
      - --repeat=2
      - --fixtures=/app/fixtures

  consumer:
    <<: *java-base
    depends_on:
      producer:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - consume
      - --lab=backlog-recovery
      - --uri=amqp://guest:guest@rabbitmq:5672
      - --queue=orders.backlog
      - --db=/data/idempotency.db
      - --expected=6

  inspect-db:
    <<: *java-base
    volumes:
      - ../target/hello-mq-rabbitmq.jar:/app/demo.jar:ro
      - idempotency:/data:ro
    depends_on:
      consumer:
        condition: service_completed_successfully
    command: ["java", "-jar", "/app/demo.jar", "inspect-db", "--lab=backlog-recovery", "--db=/data/idempotency.db"]

volumes:
  idempotency:
