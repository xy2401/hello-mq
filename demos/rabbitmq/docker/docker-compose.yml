# rabbitmq/cli-tools：只起单节点 rabbitmq（management 镜像），队列/状态操作全部由镜像自带
# rabbitmqctl / rabbitmq-diagnostics 完成；镜像内无 curl/python3，收发消息经宿主机 curl 调
# management HTTP API（15672）。不引入任何客户端 SDK。
# 独立运行：bash run.sh
name: hello-mq-rabbitmq-cli-tools

services:
  rabbitmq:
    image: ${RABBITMQ_IMAGE:?RABBITMQ_IMAGE must be set via --env-file ../../.env.versions}
    hostname: hello-mq-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:15672:15672"
    # 实验语义要求每次全新启动：不挂持久卷，down 时数据随容器一起销毁。
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
