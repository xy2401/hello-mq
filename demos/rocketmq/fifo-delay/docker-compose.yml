# rocketmq/fifo-delay 完整实验流程：FIFO Topic 同 MessageGroup 保序消费（先生产后消费顺序不变），
# 定时消息实际投递延迟不小于设定值。拓扑经 mqadmin 由 run.sh 分阶段创建。
# 独立运行：bash run.sh
name: hello-mq-rocketmq-fifo-delay

x-java-base: &java-base
  image: ${TEMURIN_JRE_IMAGE:?TEMURIN_JRE_IMAGE must be set via --env-file ../.env.versions}
  volumes:
    - ../target/hello-mq-rocketmq.jar:/app/demo.jar:ro
    - ../../shared/fixtures:/app/fixtures:ro

services:
  namesrv:
    image: ${ROCKETMQ_IMAGE:?ROCKETMQ_IMAGE must be set via --env-file ../.env.versions}
    command: ["nameserver"]
    environment:
      # 官方脚本默认 namesrv 1g 堆；实验机资源有限，显式调小（HEAP_OPTS 由 runserver.sh 读取）。
      HEAP_OPTS: "-Xms256m -Xmx256m -Xmn128m"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  broker:
    image: ${ROCKETMQ_IMAGE:?ROCKETMQ_IMAGE must be set via --env-file ../.env.versions}
    command: ["broker", "-c", "/home/rocketmq/conf/broker.conf"]
    environment:
      HEAP_OPTS: "-Xms512m -Xmx512m -Xmn256m -XX:MaxDirectMemorySize=512m"
    volumes:
      - ../broker.conf:/home/rocketmq/conf/broker.conf:ro
    depends_on:
      namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/10911'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  proxy:
    image: ${ROCKETMQ_IMAGE:?ROCKETMQ_IMAGE must be set via --env-file ../.env.versions}
    command: ["sh", "mqproxy", "-n", "namesrv:9876"]
    environment:
      HEAP_OPTS: "-Xms256m -Xmx256m -Xmn128m"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    # 实验语义要求每次全新启动：不挂持久卷，down 时数据随容器一起销毁。

  # setup 在 rocketmq jar 中为 noop（Topic/消费组由 run.sh 经 mqadmin 创建），声明以保持编排链对称。
  setup:
    <<: *java-base
    depends_on:
      proxy:
        condition: service_healthy
    command: ["java", "-jar", "/app/demo.jar", "setup", "--lab=fifo-delay"]

  producer-fifo:
    <<: *java-base
    depends_on:
      setup:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - produce
      - --lab=fifo-delay
      - --topic=orders-fifo
      - --files=order-1001.json,order-1002.json,order-1003.json
      - --group=order-1001
      - --fixtures=/app/fixtures
      - --endpoints=proxy:8081

  consumer-fifo:
    <<: *java-base
    volumes:
      - ../target/hello-mq-rocketmq.jar:/app/demo.jar:ro
      - ../../shared/fixtures:/app/fixtures:ro
      - idempotency:/data
    depends_on:
      producer-fifo:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - consume
      - --topic=orders-fifo
      - --group=orders-fifo-group
      - --db=/data/idempotency-fifo.db
      - --lab=fifo-delay
      - --expected=3
      - --endpoints=proxy:8081

  producer-delay:
    <<: *java-base
    depends_on:
      consumer-fifo:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - produce
      - --lab=fifo-delay
      - --topic=orders-delay
      - --files=order-1001.json
      - --delay-ms=3000
      - --fixtures=/app/fixtures
      - --endpoints=proxy:8081

  consumer-delay:
    <<: *java-base
    volumes:
      - ../target/hello-mq-rocketmq.jar:/app/demo.jar:ro
      - ../../shared/fixtures:/app/fixtures:ro
      - idempotency:/data
    depends_on:
      producer-delay:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - consume
      - --topic=orders-delay
      - --group=orders-delay-group
      - --db=/data/idempotency-delay.db
      - --lab=fifo-delay
      - --expected=1
      - --hard-timeout-ms=30000
      - --endpoints=proxy:8081

volumes:
  idempotency:
