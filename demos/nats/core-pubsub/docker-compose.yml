# nats/core-pubsub 完整实验流程：拓扑初始化 → 无订阅者发布（lost 即发即弃）→
# 先订阅再发布（live 3 发 3 收）→ 幂等库检查。
# Core NATS 无缓冲：live 阶段必须等订阅抵达服务端后再发布，该时序由 run.sh 分阶段编排
# （compose 条件无法表达"订阅已注册"，producer-live 仅依赖 consumer 启动）。
# 独立运行：bash run.sh
name: hello-mq-nats-core-pubsub

x-java-base: &java-base
  image: ${TEMURIN_JRE_IMAGE:?TEMURIN_JRE_IMAGE must be set via --env-file ../.env.versions}
  environment:
    HELLOMQ_NATS_URL: nats://nats:4222
  volumes:
    - ../target/hello-mq-nats.jar:/app/demo.jar:ro
    - ../../shared/fixtures:/app/fixtures:ro

services:
  nats:
    image: ${NATS_IMAGE:?NATS_IMAGE must be set via --env-file ../.env.versions}
    hostname: hello-mq-nats
    # -js 启用 JetStream；-m 8222 开启 HTTP 监控（仅绑定 127.0.0.1）
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    # 实验语义要求每次全新启动：不挂持久卷，down 时数据随容器一起销毁。
    healthcheck:
      # 镜像内是 BusyBox wget，不支持 GNU wget 的 --spider。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  setup:
    <<: *java-base
    depends_on:
      nats:
        condition: service_healthy
    command: ["java", "-jar", "/app/demo.jar", "setup", "--lab=core-pubsub"]

  producer-lost:
    <<: *java-base
    depends_on:
      setup:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - produce
      - --lab=core-pubsub
      - --mode=core
      - --subject=orders.core
      - --files=order-1001.json,order-1002.json,order-1003.json
      - --fixtures=/app/fixtures
      - --phase=lost

  consumer:
    <<: *java-base
    volumes:
      - ../target/hello-mq-nats.jar:/app/demo.jar:ro
      - ../../shared/fixtures:/app/fixtures:ro
      - idempotency:/data
    depends_on:
      producer-lost:
        condition: service_completed_successfully
    command:
      - java
      - -jar
      - /app/demo.jar
      - consume
      - --lab=core-pubsub
      - --mode=core
      - --subject=orders.core
      - --consumer=consumer-1
      - --db=/data/idempotency.db
      - --expected=3

  producer-live:
    <<: *java-base
    depends_on:
      consumer:
        condition: service_started
    command:
      - java
      - -jar
      - /app/demo.jar
      - produce
      - --lab=core-pubsub
      - --mode=core
      - --subject=orders.core
      - --files=order-1001.json,order-1002.json,order-1003.json
      - --fixtures=/app/fixtures
      - --phase=live

  inspect-db:
    <<: *java-base
    volumes:
      - ../target/hello-mq-nats.jar:/app/demo.jar:ro
      - idempotency:/data:ro
    depends_on:
      consumer:
        condition: service_completed_successfully
    command: ["java", "-jar", "/app/demo.jar", "inspect-db", "--lab=core-pubsub", "--db=/data/idempotency.db"]

volumes:
  idempotency:
