# Kafka 4.x 官方镜像单节点 KRaft 模式（规格 §7.2：KRaft 为默认主线，不使用 ZooKeeper）。
name: hello-mq-kafka

services:
  kafka:
    image: ${KAFKA_IMAGE:?KAFKA_IMAGE must be set via --env-file .env.versions}
    hostname: hello-mq-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # 官方镜像示例 CLUSTER_ID（kafka-storage random-uuid 的文档样例值，非秘密）。
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # 实验客户端运行在宿主机：advertise 到 127.0.0.1:9092（仅本地回环）。
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "127.0.0.1:9092:9092"
    # 实验语义要求每次全新启动：不挂持久卷，down 时数据随容器一起销毁。
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
