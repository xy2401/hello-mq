name: hello-mq-redis-streams

services:
  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be set via --env-file .env.versions}
    hostname: hello-mq-redis
    # AOF 开启：Streams 条目落盘语义实验；消息安全仍取决于持久化策略（见分卷 reliability 页）
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    # 实验语义要求每次全新启动：不挂持久卷，down 时数据随容器一起销毁。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
